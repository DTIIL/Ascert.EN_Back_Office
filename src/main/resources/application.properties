spring.application.name=backoffice-application

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HTTP Session Configuration
server.servlet.session.timeout=60m

# Session Cookie Security
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# ==================================================
# Microsoft 365 SSO - OAuth2 / OpenID Connect
# ==================================================

# Registration name: sso
# Client id, client secret, and issuer URI are read once from master_properties at startup.
spring.security.oauth2.client.registration.sso.provider=microsoft
spring.security.oauth2.client.registration.sso.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sso.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.sso.scope=openid,profile,email

# ==================================================
# Proxy / Forwarded Headers Support
# ==================================================
server.forward-headers-strategy=framework