spring.application.name=backoffice-application

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ascerten_data
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HTTP Session Configuration
server.servlet.session.timeout=60m

# Session Cookie Security
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# ==================================================
# Microsoft 365 SSO - OAuth2 / OpenID Connect
# ==================================================

# Registration name: sso
spring.security.oauth2.client.registration.sso.provider=microsoft
spring.security.oauth2.client.registration.sso.client-id=6443b21d-1b5a-40c2-954f-a8db4ed7381d
spring.security.oauth2.client.registration.sso.client-secret=${MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.sso.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sso.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.sso.scope=openid,profile,email

# Microsoft Entra ID provider
spring.security.oauth2.client.provider.microsoft.issuer-uri=https://login.microsoftonline.com/3966e086-f2d2-4ae0-8df6-cc13965754e8/v2.0


